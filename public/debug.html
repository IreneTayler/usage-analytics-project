<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .debug {
            background: #f5f5f5;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .error {
            background: #ffebee;
            color: #c62828;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>

<body>
    <h1>Dashboard Debug</h1>
    <div id="status">Testing...</div>

    <script>
        async function testAPI() {
            const statusDiv = document.getElementById('status');

            try {
                statusDiv.innerHTML = '<div class="debug">Fetching API data...</div>';

                const response = await fetch('/api/usage/stats?days=7', {
                    headers: { Authorization: 'Bearer test-api-key-123' }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                statusDiv.innerHTML = `
                    <div class="success">API Response received!</div>
                    <div class="debug">
                        <h3>Raw API Response:</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;

                // Test if React is loaded
                if (typeof React !== 'undefined') {
                    statusDiv.innerHTML += '<div class="success">React is loaded</div>';
                } else {
                    statusDiv.innerHTML += '<div class="error">React is NOT loaded</div>';
                }

                // Test if components are loaded
                if (typeof Header !== 'undefined') {
                    statusDiv.innerHTML += '<div class="success">Header component is loaded</div>';
                } else {
                    statusDiv.innerHTML += '<div class="error">Header component is NOT loaded</div>';
                }

            } catch (error) {
                statusDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        testAPI();
    </script>
</body>

</html>
